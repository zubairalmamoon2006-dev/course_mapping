<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Mapping Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-header">
    <div class="header-left">
      <img src="../images/ugac.jpg" alt="UGAC Logo" class="ugac-logo">
    </div>
    <div class="header-center">
      <h1>Course Mapping Portal</h1>
      <div class="subtitle">IIT Bombay Semester Exchange</div>
    </div>
    <div class="header-right">
      <h2>Data Analytics and Visualization Team</h2>
      <img src="../images/dav.png" class="dav-logo" alt="DAV Logo">
    </div>
  </div>

  <div class="container">
    <div class="filter-section">
      <div class="filter-row">
        <div class="filter-item autocomplete-wrapper">
          <label for="course">Course Code</label>
          <input type="text" id="course" placeholder="e.g. CS 101" autocomplete="off" />
          <div id="autocomplete-list" class="autocomplete-list"></div>
        </div>
        <div class="filter-item">
          <label for="department">Department</label>
          <select id="department">
            <option value="">Loading...</option>
          </select>
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-item">
          <label for="country">Country</label>
          <select id="country">
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="university">Foreign University</label>
          <select id="university">
            <option value="">Loading...</option>
          </select>
        </div>
      </div>

      <div class="filter-button">
        <button id="backBtn">Return to Main Page</button>
        <button id="submitBtn">Submit</button>
        <button id="resetBtn">Reset Filters</button>
        <button id="exportBtn">Export to Excel</button>
      </div>
    </div>

    <div id="credit-calculator">
      <strong>Bookmarked: </strong><span id="selected-count">0</span> courses &nbsp;|&nbsp;
      <strong>IITB Credits: </strong><span id="total-iitb-credits">0</span>
    </div>

    <div id="bookmarks-section">
      <h3>Bookmarked Courses</h3>
      <div id="bookmarks-list"></div>
    </div>

    <div id="results-section">
      <table id="results-table">
        <thead>
          <tr>
            <th>IITB Course Code</th>
            <th>Department</th>
            <th>Foreign University</th>
            <th>Country</th>
            <th>Foreign Course Code</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>

    <div id="recent-section">
      <h3>Recently Viewed</h3>
      <div id="recent-list"></div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
